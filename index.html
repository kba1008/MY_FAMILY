<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE MY FAMILY - Chat Room</title>
    <!-- Pustaka MQTT untuk Chat Real-Time -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* --- GAYA PROFESIONAL & MODEN (DARK THEME) --- */
        :root {
            --primary: #007AFF;
            --primary-dark: #0056b3;
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --glass-bg: rgba(22, 33, 62, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Kesan Kaca Professional */
        .kaca {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 24px;
        }

        /* --- SKRIN DAFTAR --- */
        .skrin-daftar {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .kad-daftar {
            padding: 50px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: white;
        }

        .kad-daftar h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .kad-daftar p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .grid-avatar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-height: 220px;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
            scrollbar-width: thin;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        /* Gaya Avatar Clean */
        .pilihan-avatar {
            font-size: 32px;
            cursor: pointer;
            width: 48px; height: 48px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .pilihan-avatar:hover { 
            background: rgba(255,255,255,0.1); 
            transform: translateY(-2px);
        }
        
        .pilihan-avatar.dipilih { 
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.15);
            transform: scale(1.05);
        }

        .input-nama {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            text-align: center;
            outline: none;
            background: rgba(255,255,255,0.05);
            color: white;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-nama:focus {
            border-color: var(--primary);
        }

        .btn-mula {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 0;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        
        .btn-mula:hover { 
            background: var(--primary-dark);
            transform: translateY(-1px); 
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.4); 
        }

        /* --- SKRIN CHAT --- */
        .kotak-chat {
            width: 100%;
            max-width: 550px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .kepala-chat {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--glass-border);
        }

        .avatar-kecil {
            font-size: 32px; 
        }
        
        .info-user { flex: 1; overflow: hidden; }
        .nama-room { font-weight: 700; font-size: 15px; display: block; margin-bottom: 2px; }
        .status { font-size: 11px; color: var(--text-muted); }
        .status-connection { font-size: 10px; color: #4cd137; font-weight: 600; margin-top: 2px; }
        .list-online { font-size: 10px; color: #fbc531; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; opacity: 0.8; }

        .btn-group-atas { display: flex; gap: 8px; }

        /* Butang Header Minimalis */
        .btn-keluar, .btn-padam, .btn-call, .btn-video {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-keluar:hover { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border-color: #ff3b30; }
        .btn-padam:hover { background: rgba(255, 149, 0, 0.2); color: #ff9500; border-color: #ff9500; }
        .btn-call:hover { background: rgba(52, 199, 89, 0.2); color: #34c759; border-color: #34c759; }
        .btn-video:hover { background: rgba(0, 122, 255, 0.2); color: #007aff; border-color: #007aff; }

        .ruang-mesej {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0,0,0,0.1);
        }

        .baris-mesej {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            animation: muncul 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .baris-mesej.kanan { flex-direction: row-reverse; }

        .muka-pengirim { 
            font-size: 26px; 
            margin-bottom: 2px; 
        }

        .belon {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            word-wrap: break-word;
        }

        /* Belon Kiri (Kawan) - Flat Dark Grey */
        .belon-kiri { 
            background: #2d3436;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }
        .nama-pengirim-kecil {
            font-size: 10px;
            color: #a0a0a0;
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Belon Kanan (Kita) - iMessage Blue Style */
        .belon-kanan { 
            background: var(--primary);
            color: white; 
            border-bottom-right-radius: 4px; 
            /* Gradient halus untuk deepth */
            background: linear-gradient(135deg, #007AFF, #0051a8);
        }
        
        /* Gaya Media Upload */
        .media-chat { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; border: 1px solid rgba(255,255,255,0.1); }
        .btn-attach { font-size: 20px; background: none; border: none; cursor: pointer; transition: 0.2s; opacity: 0.7; color: white; padding: 5px; }
        .btn-attach:hover { opacity: 1; transform: scale(1.1); }

        @keyframes muncul {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .ruang-input {
            padding: 16px 20px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
            border-top: 1px solid var(--glass-border);
        }

        .btn-emoji-toggle {
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.7;
            padding: 5px;
        }
        .btn-emoji-toggle:hover { opacity: 1; transform: scale(1.1); }

        /* Popup Emoji Picker Clean */
        .kotak-emoji {
            position: absolute;
            bottom: 85px;
            left: 20px;
            width: 320px;
            height: 220px;
            background: #2d3436;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: none;
            grid-template-columns: repeat(7, 1fr);
            overflow-y: auto;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 50;
        }

        .item-emoji {
            font-size: 22px;
            cursor: pointer;
            text-align: center;
            padding: 6px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .item-emoji:hover { background: rgba(255,255,255,0.1); transform: scale(1.2); }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            outline: none;
            background: rgba(0,0,0,0.2);
            color: white;
            transition: 0.3s;
            font-size: 14px;
        }
        input[type="text"]:focus { 
            background: rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.3);
        }
        input[type="text"]::placeholder { color: rgba(255,255,255,0.4); }

        button.hantar {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            width: 42px; height: 42px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        button.hantar:hover { background: var(--primary-dark); transform: scale(1.05); }

        /* Amaran Merah */
        .amaran-box {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3b30;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
            z-index: 200;
            display: none;
            animation: shake 0.5s;
            font-size: 14px;
        }

        @keyframes shake {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-55%) rotate(-5deg); }
            75% { transform: translateX(-45%) rotate(5deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

    </style>
</head>
<body>

    <!-- BOX AMARAN -->
    <div id="boxAmaran" class="amaran-box">⚠️ Bahasa tidak sopan dikesan!</div>

    <!-- SKRIN DAFTAR -->
    <div class="skrin-daftar" id="skrinDaftar">
        <div class="kad-daftar kaca">
            <h2>LOVE MY FAMILY</h2>
            <p>Sila pilih Avatar 3D & Nama Samaran Unik</p>
            
            <div class="grid-avatar" id="tempatAvatar">
                <!-- Avatar dijana di sini -->
            </div>

            <input type="text" id="inputNamaUser" class="input-nama" placeholder="Nama Samaran (Cth: Mat Kilau)" maxlength="12">
            <br>
            <button class="btn-mula" onclick="masukChat()">MASUK CHAT</button>
        </div>
    </div>

    <!-- SKRIN CHAT -->
    <div class="kotak-chat kaca">
        <div class="kepala-chat">
            <div class="avatar-kecil">🏡</div>
            <div class="info-user">
                <span class="nama-room">LOVE MY FAMILY</span>
                <span class="status">Ahli Kampung Online</span>
                <div id="statusConnection" class="status-connection">Menyambung ke talian kampung...</div>
                <div id="listOnline" class="list-online">Menunggu ahli...</div>
            </div>
            <div class="btn-group-atas">
                <!-- Butang Call Ditambah -->
                <button class="btn-call" onclick="buatPanggilan('suara')" title="Panggilan Suara">📞</button>
                <button class="btn-video" onclick="buatPanggilan('video')" title="Panggilan Video">📹</button>
                <button class="btn-padam" onclick="padamChat()" title="Clear Chat">🗑️</button>
                <button class="btn-keluar" onclick="location.reload()" title="Keluar">🚪</button>
            </div>
        </div>
        
        <div class="ruang-mesej" id="paparanMesej">
            <!-- Mesej masuk sini -->
        </div>

        <!-- Popup Emoji -->
        <div class="kotak-emoji" id="popupEmoji"></div>

        <div class="ruang-input">
            <button class="btn-emoji-toggle" onclick="tukarEmoji()">😎</button>
            
            <!-- Input Media (Hidden) -->
            <input type="file" id="inputMedia" accept="image/*,video/*" style="display:none" onchange="prosesMedia(this)">
            <button class="btn-attach" onclick="document.getElementById('inputMedia').click()">📎</button>

            <input type="text" id="inputAyat" placeholder="Borak dengan sopan..." onkeypress="tekanEnter(event)">
            <button class="hantar" onclick="hantarMesej()">➤</button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI REAL-TIME (MQTT) ---
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt'; 
        const topikChat = 'kampung/kuala/selama/chat/v1'; 
        
        // --- KONFIGURASI JITSI (SELF-HOSTED) ---
        // Gantikan URL di bawah dengan domain server Jitsi anda sendiri (VPS).
        // Dengan self-hosted, limit peserta hanya dibatasi oleh CPU/RAM server anda.
        const jitsiDomain = 'https://meet.jit.si'; // Contoh: 'https://video.sekolah.com'

        let client;
        let idUnik = 'user_' + Math.random().toString(16).substr(2, 8); 

        // --- DATA ---
        let avatarPilihan = "😎"; 
        let namaUser = "Ahli Baru";
        let onlineUsers = new Set();
        
        // Senarai Perkataan Terlarang
        const senaraiCarutan = [
            "babi", "bodoh", "sial", "anjir", "fuck", "shit", "pukimak", "lancau", "kimak", "butoh", "pantat", "asshole", "bitch", "gila", "bongok", "bahlul"
        ];

        // Senarai Avatar & Emoji yang dikemaskini
        const senaraiAvatar = [
            "👦","👧","👱","👨‍🦱","👩‍🦰","🧔","🧕","👲","👮","🕵️","👷","🦸","🦹","🧙","🧚","🧛","🧜","🧝","🧞","🧟","👽","🤖","🦁","🐯","🐻","🐨","🐼","🐸","🐙","🦄",
            "🐶","🐱","🐵","🙉","🙊","🐧","🐦","🐤","🦆","🦅","🦉","🦇","🐝","🐛","🦋","🐌","🐞","🐜","🕷️","🦗","🐢","🐍","🦎","🦖","🦕","🐙","🦑","🦐","🦞","🦀",
            "😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
            "❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","🔥","✨","🌟","💫","💥","💢","💦","💧","💤","👋","🤚","🖐️",
            "👍","👎","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦵","🦶","👂","👃","🧠","🦷","🦴","👀","👁️","👅","👄","💋","👶","🧒","🧑","👱","🧔","👴","👵",
            "🍔","🍟","🍕","🌭","🥪","🌮","🌯","🥗","🥘","🥫","🍝","🍜","🍲","🍛","🍣","🍱","🥟","🍤","🍙","🍚","🍘","🍥","🥠","🍢","🍡","🍧","🍨","🍦","🥧","🍰"
        ];

        // --- SETUP AWAL ---
        const bekasAvatar = document.getElementById('tempatAvatar');
        const popupEmoji = document.getElementById('popupEmoji');
        const statusConn = document.getElementById('statusConnection');
        const listOnlineDiv = document.getElementById('listOnline');
        
        // Load history masa mula
        window.onload = function() {
            muatHistory();
        };

        // 1. Buat butang avatar daftar
        senaraiAvatar.forEach(emoji => {
            const btn = document.createElement('div');
            btn.className = 'pilihan-avatar';
            btn.innerText = emoji;
            btn.onclick = function() {
                pilihAvatarIni(this, emoji);
            };
            bekasAvatar.appendChild(btn);
        });

        // 2. Buat butang emoji chat
        senaraiAvatar.forEach(emoji => {
            const span = document.createElement('div');
            span.className = 'item-emoji';
            span.innerText = emoji;
            span.onclick = function() {
                tambahEmojiKeInput(emoji);
            };
            popupEmoji.appendChild(span);
        });

        // --- FUNGSI UTAMA ---

        function pilihAvatarIni(elemen, emoji) {
            document.querySelectorAll('.pilihan-avatar').forEach(el => el.classList.remove('dipilih'));
            elemen.classList.add('dipilih');
            avatarPilihan = emoji;
        }

        function masukChat() {
            const input = document.getElementById('inputNamaUser');
            let namaTaip = input.value.trim();

            if (namaTaip === "") {
                alert("Sila masukkan nama samaran dulu!");
                return;
            }

            if (cekCarutan(namaTaip)) {
                tunjukAmaran("Nama tidak sopan tidak dibenarkan!");
                input.value = "";
                return;
            }

            namaUser = namaTaip;
            document.getElementById('skrinDaftar').style.transform = "translateY(-150%)"; 
            
            // Mula sambungan ke Server
            mulaSambunganMQTT();
        }

        // --- FUNGSI PERSISTENCE (SIMPAN CHAT) ---
        function muatHistory() {
            let data = localStorage.getItem('chat_history_kg');
            if (data) {
                let history = JSON.parse(data);
                history.forEach(item => {
                    tambahBelon(item.mesej, item.nama, item.avatar, item.isKita, false, item.mediaType);
                });
            }
        }

        function simpanHistory(ayat, nama, muka, isKita, mediaType = null) {
            let data = localStorage.getItem('chat_history_kg');
            let history = data ? JSON.parse(data) : [];
            history.push({ mesej: ayat, nama: nama, avatar: muka, isKita: isKita, mediaType: mediaType });
            localStorage.setItem('chat_history_kg', JSON.stringify(history));
        }

        function padamChat() {
            let pass = prompt("Masukkan Kata Laluan Admin untuk Padam:");
            if (pass === "101010") {
                // Local clear
                localStorage.removeItem('chat_history_kg');
                document.getElementById('paparanMesej').innerHTML = '';
                
                // Hantar signal kepada semua user untuk padam chat
                hantarData({ jenis: 'clear_all' });

                alert("Chat telah dikosongkan untuk SEMUA orang!");
            } else {
                if(pass !== null) alert("Kata laluan salah!");
            }
        }

        // --- FUNGSI REAL-TIME (MQTT) ---
        function mulaSambunganMQTT() {
            statusConn.innerText = "Menghubungi satelit kampung...";
            
            client = mqtt.connect(brokerUrl);

            client.on('connect', function () {
                statusConn.innerText = "🟢 Talian Kampung Bersambung!";
                statusConn.style.color = "#00ff00";
                
                client.subscribe(topikChat, function (err) {
                    if (!err) {
                        // Beritahu kita masuk
                        hantarData({
                            jenis: 'join',
                            nama: namaUser
                        });

                        // Minta history dari rakan lain
                        hantarData({ jenis: 'request_sync' });

                        onlineUsers.add(namaUser);
                        updateListOnline();
                    }
                });
            });

            client.on('message', function (topic, message) {
                let data = JSON.parse(message.toString());
                
                // Abaikan mesej sendiri, KECUALI arahan 'clear_all' mungkin perlu diproses juga secara logik 
                // (tetapi kita dah proses local di padamChat, so boleh ignore juga)
                if (data.idPengirim === idUnik) return;

                if (data.jenis === 'chat') {
                    tambahBelon(data.mesej, data.nama, data.avatar, false, true, data.mediaType);
                } else if (data.jenis === 'join') {
                    // Orang baru masuk, kita balas bagitahu kita ada
                    onlineUsers.add(data.nama);
                    updateListOnline();
                    hantarData({ jenis: 'presence', nama: namaUser });
                } else if (data.jenis === 'presence') {
                    // Orang sedia ada bagitahu dia ada
                    onlineUsers.add(data.nama);
                    updateListOnline();
                } else if (data.jenis === 'request_sync') {
                    // Ada user baru minta history
                    let localData = localStorage.getItem('chat_history_kg');
                    if (localData) {
                        let historyArr = JSON.parse(localData);
                        // Hantar 50 mesej terakhir sahaja supaya tak berat
                        let payload = historyArr.slice(-50);
                        hantarData({ jenis: 'response_sync', dataHistory: JSON.stringify(payload) });
                    }
                } else if (data.jenis === 'response_sync') {
                    // Terima history orang lain
                    if (!localStorage.getItem('chat_history_kg')) {
                        let received = JSON.parse(data.dataHistory);
                        received.forEach(item => {
                            tambahBelon(item.mesej, item.nama, item.avatar, false, true, item.mediaType);
                        });
                    }
                } else if (data.jenis === 'clear_all') {
                    // ARAHAN DARI ADMIN UNTUK PADAM SEMUA
                    localStorage.removeItem('chat_history_kg');
                    document.getElementById('paparanMesej').innerHTML = '';
                    tunjukAmaran("Admin telah memadam semua chat untuk semua pengguna!");
                }
            });
            
            client.on('offline', function() {
                statusConn.innerText = "🔴 Talian Terputus...";
                statusConn.style.color = "red";
            });
        }

        function updateListOnline() {
            let arr = Array.from(onlineUsers);
            listOnlineDiv.innerText = "Online: " + arr.join(", ");
        }

        function hantarData(objekData) {
            objekData.idPengirim = idUnik;
            // MQTT public limit payload size, so be careful with big images
            client.publish(topikChat, JSON.stringify(objekData));
        }

        const paparan = document.getElementById('paparanMesej');
        const inputAyat = document.getElementById('inputAyat');

        function cekCarutan(teks) {
            let teksKecil = teks.toLowerCase();
            return senaraiCarutan.some(kata => teksKecil.includes(kata));
        }

        function tunjukAmaran(mesej) {
            const box = document.getElementById('boxAmaran');
            box.innerText = "⚠️ " + mesej;
            box.style.display = "block";
            setTimeout(() => {
                box.style.display = "none";
            }, 3000);
        }

        function hantarMesej() {
            const teks = inputAyat.value.trim();
            if (teks === "") return;

            if (cekCarutan(teks)) {
                tunjukAmaran("Dilarang mencarut! Mesej dipadam.");
                inputAyat.value = '';
                return;
            }

            tambahBelon(teks, namaUser, avatarPilihan, true, true);
            hantarData({
                jenis: 'chat',
                nama: namaUser,
                avatar: avatarPilihan,
                mesej: teks
            });

            inputAyat.value = '';
            skrolKeBawah();
            popupEmoji.style.display = 'none';
        }

        // --- UPLOAD MEDIA ---
        function prosesMedia(input) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                
                reader.onload = function(e) {
                    let hasil = e.target.result;
                    let type = file.type.startsWith('video') ? 'video' : 'image';
                    
                    // Hantar data
                    tambahBelon(hasil, namaUser, avatarPilihan, true, true, type);
                    hantarData({
                        jenis: 'chat',
                        nama: namaUser,
                        avatar: avatarPilihan,
                        mesej: hasil,
                        mediaType: type
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function tambahBelon(kandungan, nama, muka, isKita = false, save = false, mediaType = null) {
            let kelasBaris = isKita ? 'baris-mesej kanan' : 'baris-mesej';
            let kelasBelon = isKita ? 'belon belon-kanan' : 'belon belon-kiri';
            
            let htmlNama = isKita ? '' : `<span class="nama-pengirim-kecil">${nama}</span>`;
            let htmlContent = kandungan;

            if (mediaType === 'image') {
                htmlContent = `<img src="${kandungan}" class="media-chat">`;
            } else if (mediaType === 'video') {
                htmlContent = `<video src="${kandungan}" controls class="media-chat"></video>`;
            }

            const html = `
                <div class="${kelasBaris}">
                    <div class="muka-pengirim">${muka}</div>
                    <div class="${kelasBelon}">
                        ${htmlNama}
                        ${htmlContent}
                    </div>
                </div>
            `;
            
            paparan.insertAdjacentHTML('beforeend', html);
            skrolKeBawah();
            
            if(save) {
                simpanHistory(kandungan, nama, muka, isKita, mediaType);
            }
        }

        function skrolKeBawah() {
            paparan.scrollTop = paparan.scrollHeight;
        }

        function tekanEnter(event) {
            if (event.key === "Enter") hantarMesej();
        }
        
        function tukarEmoji() {
            if (popupEmoji.style.display === 'grid') {
                popupEmoji.style.display = 'none';
            } else {
                popupEmoji.style.display = 'grid';
            }
        }

        function tambahEmojiKeInput(emoji) {
            inputAyat.value += emoji;
            inputAyat.focus();
        }

        // --- FUNGSI PANGGILAN VIDEO/SUARA ---
        function buatPanggilan(jenis) {
            // Jana ID bilik unik
            let roomName = "KKS_Room_" + Math.floor(Math.random() * 9999);
            // Gunakan Jitsi Meet (Self-Hosted logic)
            let link = jitsiDomain + "/" + roomName;
            
            let textInfo = "";
            if(jenis === 'suara') {
                textInfo = "📞 Panggilan Suara Dimulakan";
            } else {
                textInfo = "📹 Panggilan Video Dimulakan";
            }

            // Buat HTML Link yang boleh diklik
            let htmlLink = `<br><br><a href="${link}" target="_blank" style="color: #fff; background: green; padding: 5px 10px; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: bold;">➡️ SERTAI ${jenis.toUpperCase()} SEKARANG</a>`;
            
            let fullMesej = textInfo + htmlLink;

            // Hantar ke diri sendiri
            tambahBelon(fullMesej, namaUser, avatarPilihan, true, true);
            
            // Broadcast ke semua orang
            hantarData({
                jenis: 'chat',
                nama: namaUser,
                avatar: avatarPilihan,
                mesej: fullMesej
            });
        }

    </script>

</body>
