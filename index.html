<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#075E54" />
<title>LOVE MY FAMILY - Chat</title>
<link rel="manifest" href="./manifest.json" />
<style>
  :root {
    --wa-green: #075E54;
    --wa-green-2: #128C7E;
    --wa-light-green: #25D366;
    --wa-teal: #34B7F1;
    --wa-bg: #0b141a;
    --wa-panel: #111b21;
    --wa-panel-2: #202c33;
    --wa-bubble-out: #005c4b;
    --wa-bubble-in: #202c33;
    --wa-text: #e9edef;
    --wa-muted: #8696a0;
    --wa-divider: #233138;
    --wa-input: #2a3942;
    --wa-link: #53bdeb;
    --wa-chat-bg: #0b141a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--wa-bg); color: var(--wa-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .hidden { display: none !important; }

  /* ---------- LOGIN ---------- */
  .login-wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #1f2c33 0%, #0b141a 60%);
    padding: 16px; z-index: 50;
  }
  .login-card {
    background: var(--wa-panel); border: 1px solid var(--wa-divider);
    border-radius: 16px; padding: 28px; width: 100%; max-width: 420px;
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
  }
  .login-card h1 {
    margin: 0 0 4px; font-size: 22px; text-align: center;
    color: #fff; letter-spacing: .3px;
  }
  .login-card .sub { text-align: center; color: var(--wa-muted); font-size: 13px; margin-bottom: 18px; }

  .avatar-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    background: #0e1a20; padding: 10px; border-radius: 12px;
    max-height: 220px; overflow-y: auto; margin-bottom: 14px;
  }
  .avatar-pick {
    font-size: 24px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    background: #1f2c33; border-radius: 10px; cursor: pointer; border: 2px solid transparent;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .avatar-pick:hover { background: #243740; transform: translateY(-1px); }
  .avatar-pick.selected { border-color: var(--wa-light-green); background: #14342c; }

  .input-name {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    background: var(--wa-input); color: #fff; border: 1px solid transparent; outline: none;
    font-size: 15px; margin-bottom: 14px;
  }
  .input-name:focus { border-color: var(--wa-light-green); }

  .btn-primary {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: var(--wa-light-green); color: #04241a; font-weight: 700;
    font-size: 15px; cursor: pointer; letter-spacing: .3px;
    box-shadow: 0 8px 20px rgba(37,211,102,.25);
    transition: transform .1s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-primary:active { transform: scale(.99); }

  /* ---------- CHAT ---------- */
  .chat-wrap {
    display: flex; flex-direction: column; height: 100dvh; max-width: 900px; margin: 0 auto;
    background: var(--wa-chat-bg);
  }
  .chat-header {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--wa-panel-2); border-bottom: 1px solid var(--wa-divider);
    position: sticky; top: 0; z-index: 5;
  }
  .header-av {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--wa-green-2); display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header-meta { flex: 1; min-width: 0; }
  .header-meta .room { font-weight: 600; color: #fff; font-size: 15px; }
  .header-meta .sub { font-size: 12px; color: var(--wa-muted); display: flex; gap: 8px; }
  .icon-btn {
    background: transparent; border: none; color: var(--wa-muted); cursor: pointer;
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: #2a3942; color: #fff; }
  .icon-btn.danger:hover { color: #f87171; }

  /* Chat background pattern (WA-like) */
  .messages {
    flex: 1; overflow-y: auto; padding: 14px 12px 8px;
    background-color: #0b141a;
    background-image:
      radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 8px; }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-avatar { font-size: 24px; flex-shrink: 0; opacity: .9; }

  .bubble {
    max-width: 78%; padding: 6px 10px 18px; border-radius: 8px;
    position: relative; font-size: 14.5px; line-height: 1.45;
    word-wrap: break-word; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.15);
    animation: pop .18s ease-out;
  }
  .no-anim { animation: none; }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .bubble-mine  { background: var(--wa-bubble-out); border-top-right-radius: 2px; }
  .bubble-other { background: var(--wa-bubble-in);  border-top-left-radius: 2px; }

  .sender-name { font-size: 12px; font-weight: 700; color: var(--wa-link); margin-bottom: 2px; }
  .bubble-body { white-space: pre-wrap; }
  .msg-time { position: absolute; bottom: 3px; right: 8px; font-size: 10.5px; color: var(--wa-muted); }

  .media { max-width: 280px; max-height: 320px; border-radius: 8px; display: block; cursor: pointer; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.06); padding: 8px 12px; border-radius: 8px;
    color: #fff; text-decoration: none; font-size: 14px;
  }
  .file-chip:hover { background: rgba(255,255,255,.1); }

  .chat-link { color: var(--wa-link); text-decoration: underline; word-break: break-all; }

  /* ---------- COMPOSER ---------- */
  .composer {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--wa-panel-2); border-top: 1px solid var(--wa-divider); position: relative;
  }
  .composer .icon-btn { color: var(--wa-muted); }
  .input-msg {
    flex: 1; border: none; outline: none; resize: none;
    background: var(--wa-input); color: #fff; padding: 12px 16px;
    border-radius: 22px; font-size: 15px; min-height: 42px;
  }
  .input-msg::placeholder { color: var(--wa-muted); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--wa-light-green); color: #04241a;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(37,211,102,.3);
  }
  .send-btn:hover { filter: brightness(1.05); }

  .emoji-picker {
    position: absolute; bottom: 64px; left: 8px; width: min(320px, 92vw); height: 240px;
    background: var(--wa-panel); border: 1px solid var(--wa-divider); border-radius: 12px;
    padding: 8px; display: none; grid-template-columns: repeat(8, 1fr); gap: 4px;
    overflow-y: auto; z-index: 10; box-shadow: 0 16px 30px rgba(0,0,0,.5);
  }
  .emoji-item {
    font-size: 22px; text-align: center; padding: 6px; border-radius: 8px; cursor: pointer;
  }
  .emoji-item:hover { background: #2a3942; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(40px);
    background: #1f2c33; color: #fff; padding: 12px 18px; border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); opacity: 0; transition: .3s; z-index: 999;
    font-size: 14px; max-width: 92vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .bubble { max-width: 85%; }
    .header-meta .room { font-size: 14px; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <h1>💚 LOVE MY FAMILY</h1>
      <div class="sub">Pilih avatar & nama samaran untuk masuk chat</div>
      <div id="avatarGrid" class="avatar-grid"></div>
      <input id="inputName" class="input-name" type="text" maxlength="16" placeholder="Nama samaran (cth: Abang Long)" />
      <button id="btnEnter" class="btn-primary">MASUK CHAT</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatScreen" class="chat-wrap hidden">
    <div class="chat-header">
      <div id="headerAvatar" class="header-av">🏡</div>
      <div class="header-meta">
        <div class="room">LOVE MY FAMILY</div>
        <div class="sub">
          <span id="headerStatus">Menyambung...</span>
          <span>•</span>
          <span id="headerName">—</span>
        </div>
      </div>
      <button id="btnClear" class="icon-btn danger" title="Padam semua (Admin)">🗑️</button>
      <button id="btnLogout" class="icon-btn" title="Log keluar">🚪</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <button id="btnEmoji" class="icon-btn" title="Emoji">😊</button>
      <button id="btnAttach" class="icon-btn" title="Lampiran">📎</button>
      <input id="fileInput" type="file" style="display:none"
             accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.txt" />
      <input id="inputMsg" class="input-msg" type="text" placeholder="Tulis mesej..." />
      <button id="btnSend" class="send-btn" title="Hantar">➤</button>
      <div id="emojiPicker" class="emoji-picker"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
