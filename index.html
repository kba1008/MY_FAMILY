<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>LOVE MY FAMILY — Premium Chat</title>
<link rel="manifest" href="./manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* === Futuristic White / Iridescent Palette === */
    --bg-1: #f4f6fb;
    --bg-2: #e9eef8;
    --bg-3: #dde6f5;
    --surface: rgba(255,255,255,0.72);
    --surface-strong: rgba(255,255,255,0.92);
    --border: rgba(15,30,60,0.08);
    --border-strong: rgba(15,30,60,0.14);

    --ink: #0b1733;          /* deep navy ink — kontras tinggi atas putih */
    --ink-2: #2b3a5a;
    --muted: #6b7a99;

    --accent: #5b6cff;       /* indigo electric */
    --accent-2: #8b5cff;     /* violet */
    --accent-3: #22d3ee;     /* cyan */
    --accent-pink: #ff5da2;

    --bubble-mine: linear-gradient(135deg, #5b6cff 0%, #8b5cff 100%);
    --bubble-mine-ink: #ffffff;
    --bubble-other: rgba(255,255,255,0.95);
    --bubble-other-ink: #0b1733;

    --link: #2b3aff;

    /* 3D Shadows (neumorphic + elevated) */
    --shadow-sm: 0 2px 6px rgba(20,30,80,.06), 0 1px 2px rgba(20,30,80,.04);
    --shadow-md: 0 10px 24px rgba(40,55,120,.10), 0 4px 8px rgba(40,55,120,.06);
    --shadow-lg: 0 30px 60px rgba(50,70,160,.18), 0 12px 24px rgba(50,70,160,.10);
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(15,30,60,.05);
    --glow-accent: 0 10px 30px rgba(91,108,255,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background:
      radial-gradient(1200px 800px at -10% -10%, #e5ecff 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #ffe5f4 0%, transparent 55%),
      radial-gradient(900px 700px at 50% 120%, #d6f5ff 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }
  body::before {
    /* Subtle grain for premium feel */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(15,30,60,.035) 1px, transparent 1px);
    background-size: 3px 3px; mix-blend-mode: multiply; opacity: .5;
  }
  .hidden { display: none !important; }

  h1, h2, .display { font-family: "Space Grotesk", "Inter", sans-serif; letter-spacing: -.01em; }

  /* ============ LOGIN ============ */
  .login-wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .login-card {
    position: relative;
    background: var(--surface-strong);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: 28px;
    padding: 36px 30px;
    width: 100%; max-width: 440px;
    box-shadow: var(--shadow-lg), var(--shadow-inset);
    transform: perspective(1200px) rotateX(0deg);
    transition: transform .4s ease;
  }
  .login-card:hover { transform: perspective(1200px) rotateX(.6deg) translateY(-2px); }
  .login-card::before {
    content: ""; position: absolute; inset: -1px; border-radius: 28px; pointer-events: none;
    background: linear-gradient(135deg, rgba(91,108,255,.5), rgba(139,92,255,.3), rgba(34,211,238,.4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px; opacity: .8;
  }
  .login-card h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 700; text-align: center; color: var(--ink);
  }
  .login-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .avatar-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    background: linear-gradient(180deg, #f7f9ff, #eef2fb);
    padding: 12px; border-radius: 18px; border: 1px solid var(--border);
    max-height: 220px; overflow-y: auto; margin-bottom: 16px;
    box-shadow: inset 0 2px 6px rgba(20,30,80,.06);
  }
  .avatar-pick {
    font-size: 24px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 14px; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: var(--shadow-sm);
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .avatar-pick:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .avatar-pick.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(91,108,255,.15), var(--shadow-md);
    background: linear-gradient(135deg, #eef0ff, #f9f5ff);
  }

  .input-name {
    width: 100%; padding: 14px 16px; border-radius: 14px;
    background: #fff; color: var(--ink);
    border: 1px solid var(--border-strong); outline: none;
    font-size: 15px; font-family: inherit; margin-bottom: 16px;
    box-shadow: var(--shadow-inset);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-name::placeholder { color: #97a1b8; }
  .input-name:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,108,255,.15); }

  .btn-primary {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    letter-spacing: .3px; font-family: "Space Grotesk", inherit;
    box-shadow: var(--glow-accent), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .12s, filter .15s, box-shadow .2s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 36px rgba(91,108,255,.45); }
  .btn-primary:active { transform: scale(.98); }

  /* ============ CHAT ============ */
  .chat-wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; height: 100dvh;
    max-width: 960px; margin: 0 auto;
  }

  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
    box-shadow: 0 4px 20px rgba(40,55,120,.06);
  }
  .header-av {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
    box-shadow: var(--glow-accent), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .header-meta { flex: 1; min-width: 0; }
  .header-meta .room {
    font-family: "Space Grotesk", inherit;
    font-weight: 700; color: var(--ink); font-size: 16px; letter-spacing: -.01em;
  }
  .header-meta .sub { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

  .icon-btn {
    background: #fff; border: 1px solid var(--border);
    color: var(--ink-2); cursor: pointer;
    width: 40px; height: 40px; border-radius: 12px; font-size: 17px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    transition: transform .12s, box-shadow .15s, color .15s, background .15s;
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); color: var(--accent); }
  .icon-btn.danger:hover { color: #e11d48; border-color: rgba(225,29,72,.3); }

  /* ============ MESSAGES ============ */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 16px 10px;
    display: flex; flex-direction: column; gap: 10px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(91,108,255,.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,93,162,.05), transparent 40%);
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(15,30,60,.15); border-radius: 8px; }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(15,30,60,.25); }

  .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 100%; }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    background: #fff; border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .bubble {
    max-width: 78%; padding: 10px 14px 22px; border-radius: 18px;
    position: relative; font-size: 14.5px; line-height: 1.5;
    word-wrap: break-word; word-break: break-word;
    animation: pop .22s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .no-anim { animation: none; }
  @keyframes pop {
    from { transform: translateY(8px) scale(.98); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .bubble-mine {
    background: var(--bubble-mine);
    color: var(--bubble-mine-ink);
    border-bottom-right-radius: 6px;
    box-shadow: var(--glow-accent), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .bubble-other {
    background: var(--bubble-other);
    color: var(--bubble-other-ink);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(8px);
  }

  .sender-name {
    font-size: 12px; font-weight: 700; margin-bottom: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-family: "Space Grotesk", inherit;
  }
  .bubble-mine .sender-name { color: rgba(255,255,255,.95); background: none; -webkit-text-fill-color: rgba(255,255,255,.95); }
  .bubble-body { white-space: pre-wrap; }
  .msg-time {
    position: absolute; bottom: 5px; right: 12px; font-size: 10.5px;
    color: rgba(15,30,60,.45);
  }
  .bubble-mine .msg-time { color: rgba(255,255,255,.75); }

  .media { max-width: 280px; max-height: 320px; border-radius: 14px; display: block; cursor: pointer; box-shadow: var(--shadow-md); }
  .file-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(15,30,60,.06); padding: 8px 12px; border-radius: 12px;
    color: inherit; text-decoration: none; font-size: 14px; font-weight: 500;
    border: 1px solid var(--border);
  }
  .bubble-mine .file-chip { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.25); color: #fff; }
  .file-chip:hover { filter: brightness(1.05); }

  .chat-link { color: var(--link); text-decoration: underline; word-break: break-all; font-weight: 500; }
  .bubble-mine .chat-link { color: #fff; text-decoration: underline; }

  /* ============ COMPOSER ============ */
  .composer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-top: 1px solid var(--border);
    position: relative;
    box-shadow: 0 -6px 24px rgba(40,55,120,.06);
  }
  .input-msg {
    flex: 1; border: 1px solid var(--border-strong); outline: none; resize: none;
    background: #fff; color: var(--ink);
    padding: 12px 18px; border-radius: 22px;
    font-size: 15px; font-family: inherit; min-height: 44px;
    box-shadow: var(--shadow-inset);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-msg::placeholder { color: #97a1b8; }
  .input-msg:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,108,255,.15); }

  .send-btn {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--glow-accent), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .12s, filter .15s;
  }
  .send-btn:hover { filter: brightness(1.08); transform: translateY(-1px) rotate(-6deg); }
  .send-btn:active { transform: scale(.95); }

  .emoji-picker {
    position: absolute; bottom: 72px; left: 12px; width: min(340px, 92vw); height: 260px;
    background: var(--surface-strong);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-strong); border-radius: 18px;
    padding: 10px; display: none; grid-template-columns: repeat(8, 1fr); gap: 4px;
    overflow-y: auto; z-index: 10;
    box-shadow: var(--shadow-lg);
  }
  .emoji-item {
    font-size: 22px; text-align: center; padding: 6px; border-radius: 10px; cursor: pointer;
    transition: background .12s, transform .12s;
  }
  .emoji-item:hover { background: rgba(91,108,255,.1); transform: scale(1.15); }

  /* ============ TOAST ============ */
  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(40px);
    background: rgba(11,23,51,.92); color: #fff;
    padding: 12px 20px; border-radius: 24px;
    box-shadow: var(--shadow-lg); opacity: 0; transition: .3s; z-index: 999;
    font-size: 14px; font-weight: 500; max-width: 92vw; text-align: center;
    backdrop-filter: blur(12px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ CALL MODAL ============ */
  .call-modal {
    position: fixed; inset: 0; background: #0b1733; z-index: 1000;
    display: flex; flex-direction: column;
  }
  .call-modal.hidden { display: none; }
  .call-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 700; font-family: "Space Grotesk", inherit;
    box-shadow: var(--shadow-md);
  }
  .end-call-btn {
    background: #ef4444; color: #fff; border: 0; padding: 10px 18px;
    border-radius: 22px; cursor: pointer; font-weight: 700; font-family: inherit;
    box-shadow: 0 8px 20px rgba(239,68,68,.4);
    transition: transform .12s, filter .15s;
  }
  .end-call-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  #callFrame { flex: 1; width: 100%; border: 0; background: #000; }

  @media (max-width: 480px) {
    .bubble { max-width: 86%; }
    .header-meta .room { font-size: 15px; }
    .login-card { padding: 28px 22px; border-radius: 24px; }
    .icon-btn { width: 38px; height: 38px; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <h1>💚 LOVE MY FAMILY</h1>
      <div class="sub">Pilih avatar & nama samaran untuk masuk chat</div>
      <div id="avatarGrid" class="avatar-grid"></div>
      <input id="inputName" class="input-name" type="text" maxlength="16" placeholder="Nama samaran (cth: Abang Long)" />
      <button id="btnEnter" class="btn-primary">MASUK CHAT</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatScreen" class="chat-wrap hidden">
    <div class="chat-header">
      <div id="headerAvatar" class="header-av">🏡</div>
      <div class="header-meta">
        <div class="room">LOVE MY FAMILY</div>
        <div class="sub">
          <span id="headerStatus">Menyambung...</span>
          <span>•</span>
          <span id="headerName">—</span>
        </div>
      </div>
      <button id="btnAudioCall" class="icon-btn" title="Panggilan suara (Jitsi)">📞</button>
      <button id="btnVideoCall" class="icon-btn" title="Panggilan video (Jitsi)">🎥</button>
      <button id="btnClear" class="icon-btn danger" title="Padam semua (Admin)">🗑️</button>
      <button id="btnLogout" class="icon-btn" title="Log keluar">🚪</button>
    </div>

    <!-- Jitsi Call Modal -->
    <div id="callModal" class="call-modal hidden">
      <div class="call-bar">
        <span id="callTitle">📞 Panggilan</span>
        <button id="btnEndCall" class="end-call-btn">✖ Tutup</button>
      </div>
      <iframe id="callFrame" allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <button id="btnEmoji" class="icon-btn" title="Emoji">😊</button>
      <button id="btnAttach" class="icon-btn" title="Lampiran">📎</button>
      <input id="fileInput" type="file" style="display:none"
             accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.txt" />
      <input id="inputMsg" class="input-msg" type="text" placeholder="Tulis mesej..." />
      <button id="btnSend" class="send-btn" title="Hantar">➤</button>
      <div id="emojiPicker" class="emoji-picker"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
